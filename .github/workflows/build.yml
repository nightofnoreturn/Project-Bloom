name: Build & Test Bloom

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: bloom-cli-windows-x86_64
            bin_src: target/release/bloom.exe
            bin_dst: bloom-windows-x86_64.exe
          - os: ubuntu-latest
            artifact_name: bloom-cli-linux-x86_64
            bin_src: target/release/bloom
            bin_dst: bloom-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Build release binary
        run: cargo build --release --package bloom-cli

      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_src }}" "dist/${{ matrix.bin_dst }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.bin_dst }}

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.bin_dst }}
