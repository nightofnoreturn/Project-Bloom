name: Build & Test Bloom

on:
  push:
    branches: [main, master, "test/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: bloom-windows-x86_64
            cli_src: target/release/bloom.exe
            cli_dst: bloom-cli-windows-x86_64.exe
            app_src: target/release/bloom-app.exe
            app_dst: bloom-windows-x86_64.exe
            mock_app_dst: bloom-mock-windows-x86_64.exe
          - os: ubuntu-latest
            artifact_name: bloom-linux-x86_64
            cli_src: target/release/bloom
            cli_dst: bloom-cli-linux-x86_64
            app_src: target/release/bloom-app
            app_dst: bloom-linux-x86_64
            mock_app_dst: bloom-mock-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

      - name: Run unit tests (mock-device)
        run: cargo test -p bloom-core --features mock-device

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run Clippy (bloom-core mock-device)
        run: cargo clippy -p bloom-core --all-targets --features mock-device

      - name: Run Clippy (bloom-app mock-device)
        run: cargo clippy -p bloom-app --all-targets --features mock-device

      - name: Build release binaries (GUI & CLI)
        if: "!startsWith(github.ref_name, 'test/')"
        run: cargo build --release --workspace

      - name: Build release CLI (mock branch)
        if: startsWith(github.ref_name, 'test/')
        run: cargo build --release -p bloom-cli

      - name: Build release GUI with mock-device
        if: startsWith(github.ref_name, 'test/')
        run: cargo build --release -p bloom-app --features mock-device

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ github.ref_name }}" == test/* ]]; then
            cp "${{ matrix.app_src }}" "dist/${{ matrix.mock_app_dst }}"
          else
            cp "${{ matrix.app_src }}" "dist/${{ matrix.app_dst }}"
          fi
          cp "${{ matrix.cli_src }}" "dist/${{ matrix.cli_dst }}"

      - name: Upload build artifacts
        if: "!startsWith(github.ref_name, 'test/')"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/

      - name: Upload mock build artifacts
        if: startsWith(github.ref_name, 'test/')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-mock
          path: dist/

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
