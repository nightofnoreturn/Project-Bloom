[workspace]
members = [
    "crates/bloom-core",
    "crates/bloom-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nightofnoreturn/Project-Bloom"

[workspace.dependencies]
aes = "0.9"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.11"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
